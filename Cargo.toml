[workspace]
members = [".", "macros"]
resolver = "3"

[package]
name = "axotyped"
version = "0.4.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Olimi-org/axotyped"
documentation = "https://docs.rs/axotyped"
description = "Auto-generate typed TypeScript API clients from Axum route metadata"
keywords = ["axum", "typescript", "codegen", "api-client"]
categories = ["development-tools", "web-programming"]
publish = true

[features]
default = []

# Blanket `EndpointParam` impl for `WebSocketUpgrade` (WS handlers).
axum-ws = ["axum/ws"]

# Blanket `EndpointParam` impl for `axum::extract::Multipart`.
axum-multipart = ["axum/multipart"]

# --- ts-rs serde integration ---
serde-compat = ["axotyped-macros/serde-compat"]
no-serde-warnings = ["axotyped-macros/no-serde-warnings"]

# --- ts-rs formatting ---
format = ["dep:dprint-plugin-typescript"]

# --- ts type integrations (optional type support; the TS trait itself is unconditional) ---
chrono-impl = ["dep:chrono"]
bigdecimal-impl = ["dep:bigdecimal"]
uuid-impl = ["dep:uuid"]
bson-uuid-impl = ["dep:bson"]
bytes-impl = ["dep:bytes"]
url-impl = ["dep:url"]
semver-impl = ["dep:semver"]
smol_str-impl = ["dep:smol_str"]
indexmap-impl = ["dep:indexmap"]
ordered-float-impl = ["dep:ordered-float"]
serde-json-impl = ["dep:serde_json"]
tokio-impl = ["dep:tokio"]
jiff-impl = ["dep:jiff"]
arrayvec-impl = ["dep:arrayvec"]
heapless-impl = ["dep:heapless"]
astrolabe-impl = ["dep:astrolabe"]

[dependencies]
axum = "0.8"
axotyped-macros = { path = "macros", version = "0.3.0" }
tower = { version = "0.5", default-features = false }

# ts machinery deps
thiserror = { version = "2" }
serde_json = { version = "1", optional = true }

# ts-rs optional integrations
chrono = { version = "0.4", optional = true }
bigdecimal = { version = ">= 0.0.13, < 0.5", features = ["serde"], optional = true }
uuid = { version = "1", optional = true }
bson = { version = "2", optional = true }
bytes = { version = "1", optional = true }
url = { version = "2", optional = true }
semver = { version = "1", optional = true }
smol_str = { version = "0.3", optional = true }
indexmap = { version = "2", optional = true }
ordered-float = { version = ">= 3, < 6", optional = true }
tokio = { version = "1", features = ["sync"], optional = true }
jiff = { version = "0.2", optional = true }
arrayvec = { version = ">= 0.6, < 0.8", optional = true }
heapless = { version = ">= 0.7, < 0.9", optional = true }
astrolabe = { version = "0.5.4", optional = true }
dprint-plugin-typescript = { version = "= 0.95", optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
axotyped = { path = ".", features = ["axum-ws"] }
